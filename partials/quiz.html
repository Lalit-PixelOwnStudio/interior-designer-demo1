<section id="style-quiz" class="quiz wave-top">
  <div class="quiz-card" id="quiz">
    <div class="quiz-screen quiz-start is-active" data-screen="start">
      <span class="eyebrow eyebrow-light">Style Quiz</span>
      <h2 class="about-heading">What's Your Interior Style?</h2>
      <p class="section-subline">Five quick picks, about 30 seconds. We'll match you with a style — Modern, Classic or Minimal — and the projects that fit it.</p>
      <div class="quiz-start-styles" aria-hidden="true">
        <span style="background-image:url(img/projects/project-6/07-640.webp)"></span>
        <span style="background-image:url(img/projects/project-8/03-640.webp)"></span>
        <span style="background-image:url(img/projects/project-2/02-640.webp)"></span>
      </div>
      <button type="button" class="lb-cta quiz-begin" id="quizBegin">Start the Quiz</button>
    </div>

    <div class="quiz-screen quiz-questions" data-screen="questions">
      <div class="quiz-top">
        <button type="button" class="quiz-back" id="quizBack" aria-label="Previous question">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
        </button>
        <span class="quiz-step" id="quizStep">Question 1 of 5</span>
        <span class="quiz-progress"><i id="quizBar"></i></span>
      </div>
      <h3 class="quiz-q" id="quizQ" tabindex="-1"></h3>
      <div class="quiz-options" id="quizOptions" role="radiogroup" aria-labelledby="quizQ"></div>
    </div>

    <div class="quiz-screen quiz-result" data-screen="result" aria-live="polite">
      <div class="quiz-result-head">
        <span class="eyebrow eyebrow-light">Your style</span>
        <h2 class="about-heading" id="quizStyle"></h2>
        <p class="section-subline" id="quizDesc"></p>
        <div class="quiz-palette" id="quizPalette" aria-hidden="true"></div>
      </div>
      <ul class="quiz-mix" id="quizMix"></ul>
      <p class="quiz-match-title">Projects that match your style</p>
      <div class="quiz-matches" id="quizMatches"></div>
      <div class="cs-cta-btns quiz-actions">
        <a href="contact.html" class="lb-cta" id="quizWa">Send My Style on WhatsApp</a>
        <a href="contact.html#visit" class="cs-ghost">Book a Studio Visit</a>
        <button type="button" class="quiz-retake" id="quizRetake">Retake quiz</button>
      </div>
    </div>
  </div>
</section>
